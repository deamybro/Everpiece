# One row per payment (id = paymentId). Status mirrors the on-chain enum; EXPIRED is derived by readers
# (ACTIVE && now >= expiresAt), never stored.
type Payment {
  id: ID!
  sender: String! @index
  mode: Int!
  recipientCommitment: String!
  amount: BigInt!
  expiresAt: BigInt!
  status: PaymentStatus! @index
  "Set on PaymentClaimed only. Before a claim the recipient is a commitment, not an address."
  recipient: String @index
  createdAt: Int!
  createdBlock: Int!
  createdTx: String!
  settledAt: Int
  settledBlock: Int
  settledTx: String
  "Who triggered a refund of an expired payment (anyone may)."
  refundCaller: String
  events: [PaymentEvent!]! @derivedFrom(field: "payment")
}

enum PaymentStatus {
  ACTIVE
  CLAIMED
  CANCELLED
  REFUNDED
}

enum PaymentEventKind {
  CREATED
  CLAIMED
  CANCELLED
  REFUNDED
}

"Timeline entry (id = chainId_block_logIndex)."
type PaymentEvent {
  id: ID!
  payment: Payment!
  kind: PaymentEventKind!
  "sender for CREATED/CANCELLED/REFUNDED, recipient for CLAIMED"
  actor: String! @index
  amount: BigInt!
  blockNumber: Int!
  timestamp: Int!
  txHash: String!
  logIndex: Int!
}

"Real metrics from executed events only (master §29: never seeded). id = chainId."
type Stats {
  id: ID!
  created: Int!
  createdVolume: BigInt!
  claimed: Int!
  claimedVolume: BigInt!
  cancelled: Int!
  cancelledVolume: BigInt!
  refunded: Int!
  refundedVolume: BigInt!
  "Mirrors the escrow's totalActiveLiability: created − claimed − cancelled − refunded."
  activeCount: Int!
  activeLiability: BigInt!
  "Distinct addresses that sent or claimed at least one payment."
  users: Int!
  "Instant payments (EverpiecePay): final at once, no escrow."
  instantCount: Int!
  instantVolume: BigInt!
}

"An address that sent or claimed (id = the address as the event logged it)."
type Account {
  id: ID!
  firstSeenAt: Int!
  firstSeenBlock: Int!
}

"An instant payment (EverpiecePay.Paid, id = paymentId): the recipient received exactly `amount` AUSD. Final."
# One EverpieceEarn deposit or withdrawal: the facts the principal/yield ledger (docs/EARN.md) is folded from.
type EarnEvent {
  "The EverpieceEarn deposit/withdrawal id (EIP-712 digest of its terms)."
  id: ID!
  "DEPOSIT or WITHDRAW. Whether a withdrawal was a harvest is decided by its ref (the Automate leg), not here."
  kind: String!
  ref: String!
  owner: String! @index
  vault: String!
  assets: BigInt!
  shares: BigInt!
  block: Int!
  timestamp: Int!
  txHash: String!
}

type InstantPayment {
  id: ID!
  ref: String!
  sender: String! @index
  recipient: String! @index
  amount: BigInt!
  "AUSD for a direct payment, otherwise the token converted through Agora Instant Settlement."
  sourceToken: String!
  sourceAmount: BigInt!
  "The Agora pair used (zero address for a direct AUSD payment)."
  pair: String!
  block: Int!
  timestamp: Int!
  txHash: String!
}
