name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (forge, network=monad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3 # docs/VERIFIED.md §1.12 — Monad requires >= 1.8
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test (unit, boundary, authorization, fuzz 10k, invariants) — fork suites skip offline
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vv
      - name: Shared ABI is in sync with the contract
        run: |
          node scripts/gen-shared-abi.mjs
          git diff --exit-code -- packages/shared/src/abi.ts

  shared:
    name: packages/shared (vectors, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
