# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Everpiece history indexer (master §29): the four EverpieceEscrow payment events, EverpiecePay's Paid event and
# EverpieceEarn's deposits/withdrawals (the principal/yield ledger of docs/EARN.md).
# Keys follow node_modules/envio/evm.schema.json of envio 3.12.1 (pinned). History only: financial truth stays
# getPayment at "finalized" (ESCROW_SPEC §17).
name: everpiece-indexer
description: Everpiece escrow payment history and metrics
schema: ./schema.graphql
handlers: ./src/handlers
address_format: checksum
bytes_type: hex
# Monad "finalized" = head − 2 (VERIFIED §1.14). Production: ENVIO_BLOCK_LAG=3 (one block of margin); reorg rollback stays on.
# Tests use 0: a simulated chain stops at its last block, so a lag would keep the last events out of reach.
rollback_on_reorg: true
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: EverpieceEscrow
    events:
      # Must match contracts/src/interfaces/IEverpieceEscrow.sol (checked against the shared ABI in test/abi.test.ts).
      - event: PaymentCreated(bytes32 indexed paymentId, address indexed sender, bytes32 indexed recipientCommitment, uint8 mode, bytes32 metadataCommitment, address approver, uint256 amount, uint64 expiresAt)
      - event: PaymentClaimed(bytes32 indexed paymentId, address indexed recipient, uint256 amount)
      - event: PaymentCancelled(bytes32 indexed paymentId, address indexed sender, uint256 amount)
      - event: PaymentRefunded(bytes32 indexed paymentId, address indexed sender, uint256 amount, address caller)
  - name: EverpiecePay
    events:
      # Must match contracts/src/EverpiecePay.sol (checked against the shared ABI in test/abi.test.ts).
      - event: Paid(bytes32 indexed paymentId, bytes32 indexed ref, address indexed sender, address recipient, uint256 amount, address sourceToken, uint256 sourceAmount, address pair)
  - name: EverpieceEarn
    events:
      # Must match contracts/src/EverpieceEarn.sol (checked against the shared ABI in test/abi.test.ts).
      - event: EarnDeposited(bytes32 indexed id, bytes32 indexed ref, address indexed owner, address vault, uint256 assets, uint256 shares)
      - event: EarnWithdrawn(bytes32 indexed id, bytes32 indexed ref, address indexed owner, address vault, uint256 assets, uint256 shares)
chains:
  - id: ${ENVIO_CHAIN_ID}
    start_block: ${ENVIO_ESCROW_START_BLOCK}
    block_lag: ${ENVIO_BLOCK_LAG}
    # Production: a Monad RPC with for: fallback (HyperSync stays primary). Test stack: the fork's anvil with for: sync
    # (HyperSync indexes real mainnet and would never see a fork's escrow).
    rpc:
      - url: ${ENVIO_RPC_URL}
        for: ${ENVIO_RPC_FOR}
        # Monad's public testnet RPC answers eth_getLogs over at most 100 blocks ("limited to a 100 range");
        # cap Envio's query window below that or it backs off forever without indexing (VERIFIED §4.9).
        initial_block_interval: 90
        interval_ceiling: 90
        # back off for 2 s after an error (e.g. the public RPC's 429), so a catch-up never starves the stack's sends
        backoff_millis: 2000
    contracts:
      - name: EverpieceEscrow
        address: "${ENVIO_ESCROW_ADDRESS}"
      # Instant payments (deployed after the escrow, so the escrow's start block covers it). Zero address = none.
      - name: EverpiecePay
        address: "${ENVIO_PAY_ADDRESS}"
      # Earn router (deployed after the escrow). Zero address = none.
      - name: EverpieceEarn
        address: "${ENVIO_EARN_ADDRESS}"
